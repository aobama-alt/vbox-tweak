name: build-tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Write source
        run: |
          cat > URLGrab.m <<'SRCEOF'
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <unistd.h>
          #import <string.h>

          static NSMutableDictionary *gOrig;
          static NSString *gLast;

          static void VLog(NSString *fmt, ...) {
          va_list ap; va_start(ap, fmt);
          NSString *msg = [[NSString alloc] initWithFormat:fmt arguments:ap];
          va_end(ap);
          NSString *line = [NSString stringWithFormat:@"[%@] %@\n", [NSDate date], msg];
          NSLog(@"[URLGrab] %@", msg);
          NSString *p = [[NSHomeDirectory() stringByAppendingPathComponent:@"Documents"]
                         stringByAppendingPathComponent:@"playurl.log"];
          NSFileManager *fm = [NSFileManager defaultManager];
          if (![fm fileExistsAtPath:p]) [fm createFileAtPath:p contents:nil attributes:nil];
          NSFileHandle *fh = [NSFileHandle fileHandleForWritingAtPath:p];
          if (fh) { [fh seekToEndOfFile]; [fh writeData:[line dataUsingEncoding:NSUTF8StringEncoding]]; [fh closeFile]; }
          }

          static BOOL LooksLikeURL(NSString *s) {
          if (s.length < 12) return NO;
          if ([s hasPrefix:@"http://"] || [s hasPrefix:@"https://"]) return YES;
          if ([s rangeOfString:@".m3u8"].location != NSNotFound) return YES;
          if ([s rangeOfString:@".mp4"].location != NSNotFound) return YES;
          if ([s rangeOfString:@"token="].location != NSNotFound) return YES;
          return NO;
          }

          static void GenericHook(id self, SEL _cmd, id arg) {
          NSString *s = nil;
          if ([arg isKindOfClass:[NSString class]]) s = (NSString *)arg;
          else if ([arg isKindOfClass:[NSURL class]]) s = [(NSURL *)arg absoluteString];

          if (s && LooksLikeURL(s) && ![s isEqualToString:gLast]) {
          gLast = s;
          VLog(@"[HIT] -[%s %s] => %@", class_getName([self class]), sel_getName(_cmd), s);
          }

          NSString *key = [NSString stringWithFormat:@"%s/%s", class_getName([self class]), sel_getName(_cmd)];
          NSValue *v = gOrig[key];
          if (v) ((void(*)(id,SEL,id))[v pointerValue])(self, _cmd, arg);
          }

          static void DumpClasses(void) {
          unsigned int n = 0;
          Class *cs = objc_copyClassList(&n);
          for (unsigned int i = 0; i < n; i++) {
          const char *cn = class_getName(cs[i]);
          if (!cn || strncmp(cn, "FSMedia", 7) != 0) continue;
          VLog(@"CLASS %s", cn);
          unsigned int nm = 0;
          Method *ms = class_copyMethodList(cs[i], &nm);
          for (unsigned int j = 0; j < nm; j++)
          VLog(@"   -[%s %s] %s", cn, sel_getName(method_getName(ms[j])),
          method_getTypeEncoding(ms[j]) ?: "");
          free(ms);
          }
          free(cs);
          }

          static int Scan(void) {
          int hooked = 0;
          unsigned int n = 0;
          Class *cs = objc_copyClassList(&n);
          for (unsigned int i = 0; i < n; i++) {
          Class c = cs[i];
          const char *cn = class_getName(c);
          if (!cn || strncmp(cn, "FS", 2) != 0) continue;

          unsigned int nm = 0;
          Method *ms = class_copyMethodList(c, &nm);
          for (unsigned int j = 0; j < nm; j++) {
          SEL sel = method_getName(ms[j]);
          const char *sn = sel_getName(sel);
          if (strncmp(sn, "set", 3) != 0) continue;
          if (!strcasestr(sn, "url")) continue;
          if (method_getNumberOfArguments(ms[j]) != 3) continue;

          char *ret = method_copyReturnType(ms[j]);
          BOOL isVoid = (ret && ret[0] == 'v');
          free(ret);
          if (!isVoid) continue;

          char *a2 = method_copyArgumentType(ms[j], 2);
          BOOL isObj = (a2 && a2[0] == '@');
          free(a2);
          if (!isObj) continue;

          NSString *key = [NSString stringWithFormat:@"%s/%s", cn, sn];
          if (gOrig[key]) continue;

          gOrig[key] = [NSValue valueWithPointer:method_getImplementation(ms[j])];
          method_setImplementation(ms[j], (IMP)GenericHook);
          VLog(@"HOOKED -[%s %s]", cn, sn);
          hooked++;
          }
          free(ms);
          }
          free(cs);
          return hooked;
          }

          static int gRound = 0;

          static void Tick(void);

          static void Tick(void) {
          gRound++;
          int h = Scan();
          if (gRound <= 6 || h > 0) VLog(@"scan#%d hooked=%d", gRound, h);
          if (gRound == 3) DumpClasses();
          if (gRound > 90) return;
          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, NSEC_PER_SEC), dispatch_get_main_queue(), ^{ Tick(); });
          }

          __attribute__((constructor)) static void Init(void) {
          gOrig = [NSMutableDictionary new];
          VLog(@"=== URLGrab loaded pid=%d ===", getpid());
          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{ Tick(); });
          }
          SRCEOF
          echo "---- source written ----"
          wc -l URLGrab.m

      - name: Compile dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -dynamiclib -arch arm64 -miphoneos-version-min=14.0 \
            -isysroot "$SDK" -fobjc-arc \
            -install_name @rpath/URLGrab.dylib \
            -framework UIKit -framework Foundation \
            -o URLGrab.dylib URLGrab.m
          brew install ldid >/dev/null 2>&1 || true
          ldid -S URLGrab.dylib
          ls -lh URLGrab.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: URLGrab-dylib
          path: URLGrab.dylib
